language: python
python:
  - "2.7"
# command to install dependencies
# whitelist
branches:
  only:
    - feature/travis-ci

services:
  - mongodb
  - memcache
  - redis-server
  - elasticsearch

before_install:
  - sh install.sh 
install:
  - pip install -r requirements.txt

before_script:
  - ls ~/virtualenv/python2.7/bin
  - sudo mkdir /var/log/jupo
  - sudo mkdir /home/Workspace
  - sudo mv ../jupo /home/Workspace/
  - cd /home/Workspace/jupo
  - sudo cp src/settings.example.py src/settings.py

script:
  - sudo ~/virtualenv/python2.7/bin/supervisord -c conf/supervisord.dev.conf
  - sleep 15
  - sudo ~/virtualenv/python2.7/bin/supervisorctl -c conf/supervisord.conf tail smtpd
  - sudo ~/virtualenv/python2.7/bin/ssupervisorctl -c conf/supervisord.conf tail snowflake
