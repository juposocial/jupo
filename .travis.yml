language: python
python:
  - "2.7"
# command to install dependencies
# whitelist
branches:
  only:
    - feature/travis-ci

services:
  - mongodb
  - memcache
  - redis-server
  - elasticsearch

before_install:
  - pwd
  - sh install.sh 
install:
  - pip install -r requirements.txt --use-mirrors

before_script:
  - ls ~/virtualenv/python2.7/bin
  - sudo mkdir /var/log/jupo
  - cp src/settings.example.py src/settings.py
script:
  - sudo ~/virtualenv/python2.7/bin/supervisord -c conf/supervisord.dev.conf
  - sleep 5
  - sudo ~/virtualenv/python2.7/bin/supervisorctl -c conf/supervisord.conf