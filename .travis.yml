language: python
python:
  - "2.7"
# command to install dependencies
# whitelist
branches:
  only:
    - feature/travis-ci

services:
  - mongodb
  - memcache
  - redis-server
  - elasticsearch

before_install:
  - sh install.sh

install:
  - pip install -r requirements.txt

before_script:
  - sudo mkdir /var/log/jupo
  - sudo mkdir /home/Workspace
  - sudo mv ../jupo /home/Workspace/
  - cd /home/Workspace/jupo
  - sudo cp src/settings.example.py src/settings.py
  - sudo pip install rq
  - sudo pip install gunicorn

script:
  - sudo supervisord -c conf/supervisord.dev.conf
  - sleep 60
  - sudo supervisorctl -c conf/supervisord.conf tail web_port9000
