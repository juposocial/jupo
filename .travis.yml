language: python
python:
  - "2.7"
# command to install dependencies
# whitelist
branches:
  only:
    - develop

services:
  - mongodb
  - memcache
  - redis-server
  - elasticsearch

before_install:
  - sh install.sh

install:

before_script:
  - sudo mkdir /home/Workspace
  - sudo mv ../jupo /home/Workspace/
  - cd /home/Workspace/jupo
  - sudo cp src/settings.example.py src/settings.py
  - source ~/virtualenv/python2.7/bin/activate
script:
  - cd src
  - python main.py
