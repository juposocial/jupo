[unix_http_server]
file = /var/log/jupo/supervisor.sock

[supervisord]
logfile       = /var/log/jupo/supervisord.log
directory     = ~/jupo/src/
pidfile       = /var/run/supervisord.pid
nodaemon      = false 
minfds        = 10000                                
minprocs      = 200                                 

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/log/jupo/supervisor.sock

[inet_http_server]
port = 0.0.0.0:5000

[program:snowflake]
command         = python flake.py --worker_id=0 --port=2300
redirect_stderr = true
priority        = 3

[program:web_port9000]
command         = gunicorn -k tornado -w 4 --max-requests 1000 -b 0.0.0.0:9000 main:app
autorestart     = true
redirect_stderr = true
priority        = 4

[program:nginx]
command         = nginx -c ~/jupo/conf/nginx.min.conf
redirect_stderr = true
priority        = 5

[program:rqworker]
command         = rqworker push notification send_mail index invite urls move_to_s3
numprocs        = 2
process_name    = %(process_num)s
autorestart     = true
redirect_stderr = true
priority        = 6

[program:smtpd]
command         = python mail_server.py
redirect_stderr = true
priority        = 8